<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vibeコーディング 仕様づくりナビ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 20px 30px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 8px 0 0;
  color: #666;
}

.app {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 24px;
  max-width: 1400px;
  margin: auto;
  padding: 24px;
}

.main,
.side {
  background: white;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.step-nav {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

.step-button {
  flex: 1;
  border: none;
  padding: 14px 10px;
  border-radius: 10px;
  background: #edf1f7;
  cursor: pointer;
  font-weight: bold;
}

.step-button.active {
  background: #0b6de8;
  color: white;
}

.step {
  display: none;
}

.step.active {
  display: block;
}

h2 {
  font-size: 28px;
  margin-bottom: 8px;
}

.description {
  color: #666;
  margin-bottom: 28px;
}

.field {
  margin-bottom: 28px;
}

.field label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #bbc3ce;
  border-radius: 10px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.choice {
  border: 1px solid #bbc3ce;
  border-radius: 999px;
  background: white;
  padding: 11px 16px;
  cursor: pointer;
  transition: 0.15s;
}

.choice:hover {
  background: #eef6ff;
}

.choice.selected {
  background: #e6f1ff;
  color: #075fc7;
  border-color: #0b6de8;
  font-weight: bold;
}

.next-area {
  margin-top: 30px;
  display: flex;
  justify-content: flex-end;
}

.next-button {
  border: none;
  background: #0b6de8;
  color: white;
  padding: 13px 24px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.side {
  position: sticky;
  top: 24px;
  height: fit-content;
}

.side h3 {
  margin-top: 0;
}

.prompt {
  background: #1e2430;
  color: #eef2f8;
  border-radius: 14px;
  padding: 20px;
  white-space: pre-wrap;
  line-height: 1.8;
  min-height: 350px;
}

.copy-button {
  margin-top: 16px;
  width: 100%;
  border: none;
  background: #e8f8ee;
  color: #14733b;
  font-weight: bold;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
}

.note {
  margin-top: 14px;
  font-size: 13px;
  color: #777;
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
  }

  .side {
    position: static;
  }
}
</style>
</head>

<body>

<header>
  <h1>Vibeコーディング 仕様づくりナビ2</h1>
  <p>考えたことを選んでいくと、AIに渡す仕様ができあがります。</p>
</header>

<div class="app">

<main class="main">

  <div class="step-nav">
    <button class="step-button active" data-step="1">1 アイデア</button>
    <button class="step-button" data-step="2">2 使う場面</button>
    <button class="step-button" data-step="3">3 仕様</button>
  </div>

  <!-- STEP 1 -->
  <section class="step active" id="step1">

    <h2>何を、誰のために作りますか？</h2>
    <p class="description">
      まず、解決したい問題と作りたいものを整理します。
    </p>

    <div class="field">
      <label>作るものの名前</label>
      <input
        type="text"
        id="appName"
        placeholder="例：5問チャレンジ"
      >
    </div>

    <div class="field">
      <label>誰のために作りますか？</label>

      <div class="choices" data-target="user">
        <button class="choice">自分</button>
        <button class="choice">中学生</button>
        <button class="choice">小学生</button>
        <button class="choice">先生</button>
        <button class="choice">家族</button>
        <button class="choice">地域の人</button>
      </div>
    </div>

    <div class="field">
      <label>どんなことを良くしたいですか？</label>

      <div class="choices" data-target="problem">
        <button class="choice">分かりやすくしたい</button>
        <button class="choice">間違いを減らしたい</button>
        <button class="choice">時間を短くしたい</button>
        <button class="choice">忘れないようにしたい</button>
        <button class="choice">楽しくしたい</button>
        <button class="choice">情報を整理したい</button>
      </div>
    </div>

    <div class="field">
      <label>どんなものを作りたいですか？</label>
      <textarea
        id="idea"
        placeholder="例：授業で学習した内容を5問のクイズで確認し、間違えた問題を復習できるアプリ"
      ></textarea>
    </div>

    <div class="next-area">
      <button class="next-button" onclick="showStep(2)">
        次へ
      </button>
    </div>

  </section>

  <!-- STEP 2 -->
  <section class="step" id="step2">

    <h2>どんな場面で使いますか？</h2>
    <p class="description">
      利用する場面や機器を決めます。
    </p>

    <div class="field">
      <label>使う場面</label>

      <div class="choices" data-target="scene">
        <button class="choice">授業中</button>
        <button class="choice">授業後</button>
        <button class="choice">家庭学習</button>
        <button class="choice">休み時間</button>
        <button class="choice">学校行事</button>
        <button class="choice">地域</button>
      </div>
    </div>

    <div class="field">
      <label>使う機器</label>

      <div class="choices" data-target="device">
        <button class="choice">Chromebook</button>
        <button class="choice">パソコン</button>
        <button class="choice">タブレット</button>
        <button class="choice">スマートフォン</button>
      </div>
    </div>

    <div class="next-area">
      <button class="next-button" onclick="showStep(3)">
        次へ
      </button>
    </div>

  </section>

  <!-- STEP 3 -->
  <section class="step" id="step3">

    <h2>必要な仕様を決めましょう</h2>

    <p class="description">
      作るものに必要な機能を選びます。
    </p>

    <div class="field">
      <label>入力方法</label>

      <div class="choices multi" data-target="input">
        <button class="choice">ボタン</button>
        <button class="choice">文字入力</button>
        <button class="choice">数字入力</button>
        <button class="choice">選択肢</button>
        <button class="choice">画像</button>
      </div>
    </div>

    <div class="field">
      <label>コンピュータにしてほしいこと</label>

      <div class="choices multi" data-target="process">
        <button class="choice">比較する</button>
        <button class="choice">計算する</button>
        <button class="choice">検索する</button>
        <button class="choice">判定する</button>
        <button class="choice">記録する</button>
        <button class="choice">ランダムに選ぶ</button>
      </div>
    </div>

    <div class="field">
      <label>結果をどう伝えますか？</label>

      <div class="choices multi" data-target="output">
        <button class="choice">文字を表示</button>
        <button class="choice">画像を表示</button>
        <button class="choice">正誤を表示</button>
        <button class="choice">得点を表示</button>
        <button class="choice">解説を表示</button>
      </div>
    </div>

    <div class="field">
      <label>使いやすさの条件</label>

      <div class="choices multi" data-target="condition">
        <button class="choice">大きなボタン</button>
        <button class="choice">読みやすい文字</button>
        <button class="choice">操作を少なくする</button>
        <button class="choice">やり直せる</button>
        <button class="choice">データを保存しない</button>
      </div>
    </div>

  </section>

</main>


<aside class="side">

  <h3>現在の仕様・AIへのプロンプト</h3>

  <div class="prompt" id="prompt"></div>

  <button class="copy-button" onclick="copyPrompt()">
    プロンプトをコピー
  </button>

  <div class="note">
    コピーした文章をVibeコーディング用AIに貼り付けてください。
  </div>

</aside>

</div>


<script>

const state = {
  user: "",
  problem: "",
  scene: "",
  device: "",
  input: [],
  process: [],
  output: [],
  condition: []
};


// 選択ボタン
document.querySelectorAll(".choices").forEach(group => {

  group.addEventListener("click", e => {

    if (!e.target.classList.contains("choice")) return;

    const target = group.dataset.target;
    const multi = group.classList.contains("multi");

    if (multi) {

      e.target.classList.toggle("selected");

      state[target] =
        [...group.querySelectorAll(".choice.selected")]
        .map(el => el.textContent);

    } else {

      group.querySelectorAll(".choice")
        .forEach(el => el.classList.remove("selected"));

      e.target.classList.add("selected");

      state[target] = e.target.textContent;

    }

    updatePrompt();

  });

});


// 文字入力
["appName", "idea"].forEach(id => {

  document.getElementById(id)
    .addEventListener("input", updatePrompt);

});


function showStep(number) {

  document.querySelectorAll(".step")
    .forEach(el => el.classList.remove("active"));

  document.querySelectorAll(".step-button")
    .forEach(el => el.classList.remove("active"));

  document.getElementById("step" + number)
    .classList.add("active");

  document.querySelector(
    `.step-button[data-step="${number}"]`
  ).classList.add("active");

}


document.querySelectorAll(".step-button").forEach(button => {

  button.addEventListener("click", () => {
    showStep(button.dataset.step);
  });

});


function list(items) {

  if (!items || items.length === 0) {
    return "まだ決めていません";
  }

  return items.join("、");

}


function updatePrompt() {

  const appName =
    document.getElementById("appName").value ||
    "名前未定のWebアプリ";

  const idea =
    document.getElementById("idea").value ||
    "まだ詳しく決めていません";


  const prompt = `あなたはWebアプリ開発を支援するAIです。

私は「${appName}」というWebアプリを作りたいです。

【目的】
${state.user || "利用者未定"}のために、
「${state.problem || "解決したい問題はまだ未定"}」
という課題を解決したいです。

作りたいものの概要：
${idea}

【利用場面】
使う場面：${state.scene || "未定"}
使う機器：${state.device || "未定"}

【入力】
${list(state.input)}

【コンピュータが行う処理】
${list(state.process)}

【出力】
${list(state.output)}

【守りたい条件】
${list(state.condition)}

【重要】
まだプログラムを作り始めないでください。

まず、この仕様を実現するために、
不足している情報や曖昧な点がないか確認してください。

決める必要があることがあれば、
中学生にも分かる言葉で、一度に1つずつ質問してください。

あなた自身で仕様を勝手に決めず、
私の回答をもとに仕様を完成させてください。

仕様が十分に決まったら、
最終的な仕様を整理して私に確認してください。

私が承認した後に、
Webアプリの作成を始めてください。`;


  document.getElementById("prompt").textContent = prompt;

}


async function copyPrompt() {

  const text =
    document.getElementById("prompt").textContent;

  await navigator.clipboard.writeText(text);

  alert("プロンプトをコピーしました");

}


updatePrompt();

</script>

</body>
</html>
